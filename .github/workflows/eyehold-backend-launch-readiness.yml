name: Eyehold - Backend launch readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate runtime code and service syntax
        run: |
          node --check sidecar/index.js
          node --check frontend/app/eyehold-workboard.js
          node --check frontend/app/eyehold-layout-install.js
          node --check frontend/app/eyehold-staff-departments.js
          node --check test/eyehold-live-multidepartment.test.js
      - name: Verify physical rooms, desks, native app activation
        run: |
          node test/eyehold-seven-room-starter.test.js
          node test/eyehold-activation-ui.test.js
          node test/eyehold-departments.test.js
          node test/eyehold-workboard.test.js
      - name: Verify backend run persistence, delegation and owner review
        run: |
          node test/eyehold-launch-readiness.test.js
          node test/eyehold-runstore-adapter.test.js
          node test/eyehold-owner-review-http.test.js
          node test/eyehold-crown-runtime.test.js
          node test/eyehold-acceptance-store.test.js
          node test/eyehold-finance-truth.test.js
          node test/eyehold-finance-store.test.js
          node test/eyehold-finance-http.test.js
          node test/eyehold-loot-milestones.test.js
          node test/eyehold-native-loot.test.js
          node test/eyehold-delegation-contract.test.js
          node test/eyehold-live-stream-decoder.test.js
          node test/eyehold-external-account-policy.test.js
          node test/eyehold-seven-agent-restart.test.js
          node test/eyehold-workstream-recovery.test.js
      - name: Install browser test driver (no provider credentials)
        run: npm install --no-save --ignore-scripts playwright@1.62.1
      - name: Verify real Work Board and Treasury in desktop and mobile viewports
        env:
          EYEHOLD_CHROME: /usr/bin/google-chrome
        run: node scripts/qa/eyehold-ui-smoke.cjs eyehold-ui-evidence
      - name: Save isolated UI fixture screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eyehold-ui-fixture-proof
          path: eyehold-ui-evidence/
          if-no-files-found: ignore
          retention-days: 3
      - name: Readiness report
        run: |
          {
            printf '%s\n' '## Backend launch readiness — offline checks passed'
            printf '%s\n' 'The canonical WorldModel, staffing UI, run store and fail-closed owner-review tests passed.'
            printf '%s\n' "Not yet verified: interactive browser use, provider connectivity in the user's deployment, paid two-worker job, external accounts, real financial data, commercial profit."
            printf '%s\n' 'This is a manual, no-model-spend test and does not launch the game.'
          } >> "$GITHUB_STEP_SUMMARY"
