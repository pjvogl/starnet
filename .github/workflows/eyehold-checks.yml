name: Eyehold module checks

on:
  push:
    branches: [feat/harness-backend]
    paths:
      - 'sidecar/eyehold-*.js'
      - 'frontend/app/eyehold-*.js'
      - 'frontend/app/worldmodel.js'
      - 'test/eyehold-*.test.js'
      - '.github/workflows/eyehold-checks.yml'
      - 'scripts/qa/eyehold-release-drift.cjs'
      - 'qa/product-perfect/claims.json'
      - 'src-tauri/tauri.conf.json'
  pull_request:
    paths:
      - 'sidecar/eyehold-*.js'
      - 'frontend/app/eyehold-*.js'
      - 'frontend/app/worldmodel.js'
      - 'test/eyehold-*.test.js'
      - '.github/workflows/eyehold-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eyehold-tests:
    name: Eyehold unit tests (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime dependencies
        run: npm ci
      - name: Syntax check modified Eyehold modules
        shell: bash
        run: |
          set -euo pipefail
          for file in sidecar/eyehold-*.js frontend/app/eyehold-*.js test/eyehold-*.test.js; do
            node --check "$file"
          done
      - name: Execute offline Eyehold tests (paid proofs are manual-only)
        env:
          SKYNET_OPENROUTER_KEY: ''
          STARNET_OPENROUTER_KEY: ''
          OPENROUTER_API_KEY: ''
          SKYNET_BUDGET_GLOBAL: '0'
          SKYNET_BUDGET_PER_DAY: '0'
          SKYNET_LIVE_PRICES: '0'
          NODE_OPTIONS: --require=${{ github.workspace }}/test/helpers/eyehold-loopback-only.cjs
        shell: bash
        run: |
          set -euo pipefail
          for file in test/eyehold-*.test.js; do
            case "$file" in
              test/eyehold-live-delegation.test.js|test/eyehold-live-multidepartment.test.js)
                echo "Manual paid proof excluded: $file"
                continue
                ;;
            esac
            echo "::group::$file"
            node "$file"
            echo "::endgroup::"
          done

  release-drift-report:
    name: Read-only release drift report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inventory modified protected release surface
        shell: bash
        run: |
          mkdir -p eyehold-audit
          node scripts/qa/eyehold-release-drift.cjs > eyehold-audit/release-drift.md
          node scripts/qa/eyehold-release-drift.cjs --json > eyehold-audit/release-drift.json
          cat eyehold-audit/release-drift.md >> "$GITHUB_STEP_SUMMARY"
      - name: Attach review report
        uses: actions/upload-artifact@v4
        with:
          name: eyehold-release-drift
          path: eyehold-audit/
