name: Eyehold Phase 2 - Agent execution proof

on:
  workflow_dispatch:
    inputs:
      run_live_provider_probe:
        description: 'Opt in to a potentially billable live-provider workload (requires repository OPENROUTER_API_KEY secret)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  offline-execution:
    name: Real sidecar run path using mock model (no spend)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Exercise genuine sidecar run, streaming and completion using mock provider
        run: node test/e2e.run.test.js
      - name: Check that Eyehold roles can be deployed through existing specialty catalog
        run: |
          node test/eyehold-roles.test.js
          node test/eyehold-specialty-integration.test.js
          node test/eyehold-agent-binding.test.js
      - name: Offline scope
        if: success()
        run: |
          echo '## Phase 2 offline path: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Real sidecar and run-stream pipeline tested against a mock model; no paid AI provider and no live Deepforge task was proven.' >> "$GITHUB_STEP_SUMMARY"

  live-provider-probe:
    name: Optional live model workload (potential API charges)
    if: ${{ inputs.run_live_provider_probe == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SKYNET_OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      STARNET_SMOKE_MODEL: ${{ vars.EYEHOLD_SMOKE_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Require explicit live provider configuration
        shell: bash
        run: |
          if [ -z "$SKYNET_OPENROUTER_KEY" ]; then
            echo "::error::Repository secret OPENROUTER_API_KEY not configured. No live run attempted."
            exit 1
          fi
      - name: Install Chromium browser for live UI workload
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
          CHROME="$(command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "::error::No Chromium binary after installation."
            exit 1
          fi
          echo "SKYNET_CHROME=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version
      - name: Run existing live workload proof (real provider billing possible)
        run: node scripts/phase5-live-workload-proof.mjs
      - name: Summarize live workload failure without exposing prompts or secrets
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const root='.dogfood';
          const dirs=fs.existsSync(root)?fs.readdirSync(root).filter(s=>s.startsWith('phase5-workload-')).sort():[];
          const latest=dirs.at(-1);
          const reportPath=latest&&path.join(root,latest,'phase5-workload-report.json');
          const output={reportPresent:!!(reportPath&&fs.existsSync(reportPath))};
          if(output.reportPresent){
            const r=JSON.parse(fs.readFileSync(reportPath,'utf8'));
            const work=r.sameWork||{};
            output.checks=r.checks||{};
            output.capabilityPlacement=Array.isArray(r.placed)?r.placed.map(p=>({type:p.type||null,ok:!!p.ok,error:p.error||null})):[];
            output.runStarts=(work.starts||[]).length;
            output.runEnds=(work.ends||[]).map(e=>({reason:e.reason||'unknown'}));
            output.runErrors=(work.errors||[]).length;
            // Capture narrowly scoped provider/run error hints; never publish raw
            // request bodies, auth headers, transcript messages, or stack traces.
            const classify=(x)=>{
              const v=String(x||'').toLowerCase();
              if(/\\b(401|403)\\b|unauthoriz|invalid.api.key|authentication/.test(v))return 'provider-auth';
              if(/\\b402\\b|insufficient.credits|billing|quota|credit.balance/.test(v))return 'provider-billing';
              if(/\\b429\\b|rate.limit/.test(v))return 'provider-rate-limit';
              if(/model.not.found|unknown.model|\\b404\\b/.test(v))return 'model-unavailable';
              if(/context.length|too.many.tokens/.test(v))return 'context-limit';
              if(/fetch.failed|econn|enotfound|network|timeout/.test(v))return 'network';
              if(/capability|permission.denied|not.allowed/.test(v))return 'permissions';
              return 'unclassified';
            };
            output.errorCategories=[...new Set((work.errors||[]).map(e=>classify(JSON.stringify(e))))];
            output.modelConfigured=!!r.model;
            output.modelHint=r.model?String(r.model).replace(/[^a-zA-Z0-9/_:.-]/g,'').slice(0,90):null;
            output.costEvents=(work.costs||[]).length;
            output.toolCallCount=(work.toolCalls||[]).length;
            output.toolNames=[...new Set((work.toolCalls||[]).map(c=>c.name).filter(Boolean))];
            output.transcriptCount=(work.transcripts||[]).filter(t=>t.response&&t.response.ok).length;
            output.runLedgerRows=(work.runs&&work.runs.json&&work.runs.json.runs||[]).length;
          }
          fs.mkdirSync('eyehold-live-diagnostics',{recursive:true});
          fs.writeFileSync('eyehold-live-diagnostics/status.json',JSON.stringify(output,null,2)+'\\n');
          console.log('Nonsecret live workload diagnosis:',JSON.stringify(output));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'### Live workload diagnostics\\n\\n```json\\n'+JSON.stringify(output,null,2)+'\\n```\\n');
          NODE
      - name: Upload sanitized live diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eyehold-live-diagnostics
          path: eyehold-live-diagnostics/status.json
          if-no-files-found: warn
      - name: Clarify proof scope
        if: success()
        run: |
          echo '## Live provider workload: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Real provider workload executed. This does not alone prove Eye-to-Deepforge delegation or Crown acceptance.' >> "$GITHUB_STEP_SUMMARY"
