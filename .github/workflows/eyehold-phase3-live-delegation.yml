name: Eyehold Phase 3 - Live Eye to Deepforge proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-delegation:
    name: Live role-specific delegation (billable, capped)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SKYNET_OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      EYEHOLD_DELEGATION_MODEL: ${{ vars.EYEHOLD_DELEGATION_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check provider key and budgeted run test syntax
        shell: bash
        run: |
          test -n "$SKYNET_OPENROUTER_KEY" || { echo "::error::OPENROUTER_API_KEY secret missing"; exit 1; }
          node --check test/eyehold-live-delegation.test.js
      - name: Execute one real Eye to Deepforge run
        timeout-minutes: 5
        run: node test/eyehold-live-delegation.test.js
      - name: Summarize scope
        if: success()
        run: |
          echo '## Live Eye → Deepforge: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'A real model and sidecar produced a Deepforge child run with a persisted worker deliverable.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Not tested: Crown acceptance, revenue, continuously running hosting.' >> "$GITHUB_STEP_SUMMARY"
